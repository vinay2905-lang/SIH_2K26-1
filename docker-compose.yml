# PRAMAAN: PostgreSQL + API + background worker + web (nginx serving the React build),
# plus Caddy for automatic HTTPS when the "https" profile is on.
#   On a server, `sudo bash deploy/setup.sh --domain <your-hostname> --demo` does all of this (see docs/DEPLOY.md).
#   By hand: cp .env.example .env (set your own secrets), then `docker compose up -d --build`.
# Open http://localhost:8080, or https://<PRAMAAN_DOMAIN> with the https profile.

x-backend: &backend
  build: ./backend
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
  volumes:
    - pramaan-data:/data
  environment:
    PRAMAAN_ENV: production
    PRAMAAN_DATABASE_URL: postgresql+psycopg://pramaan:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/pramaan
    PRAMAAN_STORAGE_KEY: ${PRAMAAN_STORAGE_KEY:?set PRAMAAN_STORAGE_KEY in .env}
    PRAMAAN_JWT_SECRET: ${PRAMAAN_JWT_SECRET:?set PRAMAAN_JWT_SECRET in .env}
    PRAMAAN_JOB_MODE: worker
    PRAMAAN_ISSUER_BASE_URL: http://api:8000/sandbox
    PRAMAAN_CORS_ORIGINS: ${PRAMAAN_CORS_ORIGINS:-http://localhost:8080}
    PRAMAAN_SHOW_DEMO_LOGINS: ${PRAMAAN_SHOW_DEMO_LOGINS:-false}
    WEB_CONCURRENCY: ${PRAMAAN_API_PROCESSES:-2}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pramaan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: pramaan
      POSTGRES_INITDB_ARGS: --encoding=UTF8
    volumes:
      - pramaan-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pramaan -d pramaan"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    <<: *backend
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    <<: *backend
    command: ["python", "-m", "app.worker"]
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${PRAMAAN_HTTP_PORT:-8080}:80"

  # HTTPS with a free, auto-renewing certificate (Let's Encrypt / ZeroSSL). Needs ports 80 and 443
  # open and PRAMAAN_DOMAIN pointing at this server. Turn on with COMPOSE_PROFILES=https in .env.
  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    environment:
      PRAMAAN_DOMAIN: ${PRAMAAN_DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  pramaan-db:
  pramaan-data:
  caddy-data:
  caddy-config:
